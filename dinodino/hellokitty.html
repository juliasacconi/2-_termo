<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty & Amigos: Corrida Kawaii HD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #1e293b;
            font-family: 'Fredoka', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ff758f 0%, #ff4d6d 100%);
            border: 4px solid #ffffff;
            border-radius: 25px;
            padding: 8px 36px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4), inset 0 2px 0 rgba(255,255,255,0.4);
        }

        h1 {
            font-size: 2em;
            color: #ffffff;
            text-shadow: 2px 2px 0 #590d22;
            letter-spacing: 1.5px;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            border: 6px solid #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(255, 117, 143, 0.3);
            overflow: hidden;
            background-color: #8ecae6;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #score-board {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 8px 20px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #ff4d6d;
            border-radius: 20px;
            display: flex;
            gap: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            color: #590d22;
            font-weight: 700;
            z-index: 5;
        }

        #score-board span { color: #ff4d6d; }
        #best-score span { color: #2a9d8f; }
        #coins-score span { color: #ffb703; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 245, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        #game-title {
            font-size: 2.4em;
            color: #ff4d6d;
            text-shadow: 3px 3px 0 #ffffff, 4px 4px 0 #590d22;
            margin-bottom: 8px;
            font-weight: 700;
        }

        #char-select-title {
            font-size: 1.1em;
            color: #590d22;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .char-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .char-card {
            background: #ffffff;
            border: 3px solid #ffccd5;
            border-radius: 20px;
            padding: 12px 20px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            font-weight: 700;
            color: #590d22;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .char-card:hover {
            transform: translateY(-4px);
        }

        .char-card.selected {
            border-color: #ff4d6d;
            background: #ffe5ec;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
        }

        #start-btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            background: linear-gradient(180deg, #ffb703 0%, #fb8500 100%);
            color: #ffffff;
            border: 4px solid #ffffff;
            padding: 12px 48px;
            font-size: 1.6em;
            cursor: pointer;
            border-radius: 22px;
            box-shadow: 0 6px 0 #d62828, 0 10px 20px rgba(0,0,0,0.25);
            transition: transform 0.1s;
            text-shadow: 1px 1px 0 #000;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d62828;
        }

        #touch-controls {
            margin-top: 15px;
            display: flex;
            gap: 24px;
            width: 800px;
            justify-content: center;
        }

        .touch-btn {
            background: #ffffff;
            border: 4px solid #ff4d6d;
            border-radius: 20px;
            color: #ff4d6d;
            padding: 12px 35px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #c9184a;
            touch-action: manipulation;
            transition: transform 0.1s;
        }

        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #c9184a;
        }

        @media (max-width: 850px) {
            #game-container, #touch-controls {
                width: 95vw;
                height: calc(95vw * 0.5);
            }
            #touch-controls { height: auto; }
            #start-btn { font-size: 1.3em; padding: 10px 30px; }
            h1 { font-size: 1.3em; }
        }
    </style>
</head>
<body>

<header>
    <h1>HELLO KITTY & AMIGOS</h1>
</header>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="score-board">
        <div id="coins-score">🎀 <span>0</span></div>
        <div id="current-score">Pontos: <span>0</span></div>
        <div id="best-score">Recorde: <span>0</span></div>
    </div>

    <div id="overlay">
        <div id="game-title">CORRIDA KAWAII 🎀</div>
        <div id="char-select-title">Escolha seu personagem fofinho:</div>
        <div class="char-options">
            <div class="char-card selected" data-char="kitty">Hello Kitty</div>
            <div class="char-card" data-char="melody">My Melody</div>
            <div class="char-card" data-char="cinnamoroll">Cinnamoroll</div>
        </div>
        <button id="start-btn">COMEÇAR</button>
    </div>
</div>

<div id="touch-controls">
    <div id="jump-btn" class="touch-btn">▲ PULAR (ESPAÇO)</div>
    <div id="duck-btn" class="touch-btn">▼ AGACHAR (SETA BAIXO)</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const gameTitle = document.getElementById('game-title');
    const currentScoreSpan = document.querySelector('#current-score span');
    const bestScoreSpan = document.querySelector('#best-score span');
    const coinsScoreSpan = document.querySelector('#coins-score span');
    const jumpBtn = document.getElementById('jump-btn');
    const duckBtn = document.getElementById('duck-btn');
    const charCards = document.querySelectorAll('.char-card');

    let gameRunning = false;
    let score = 0;
    let coins = 0;
    let bestScore = localStorage.getItem('hk_hd_best') || 0;
    bestScoreSpan.innerText = bestScore;

    let gameSpeed = 6;
    let frameCount = 0;
    let bgScroll = 0;
    let selectedChar = 'kitty';

    const GROUND_Y = canvas.height - 50;
    const GRAVITY = 0.65;
    const JUMP_FORCE = -12.5;

    let player = {
        x: 80,
        y: GROUND_Y - 64,
        width: 54,
        height: 64,
        baseHeight: 64,
        duckHeight: 32,
        dy: 0,
        isJumping: false,
        isDucking: false,
        starPowerTimer: 0
    };

    let obstacles = [];
    let collectibles = [];
    let particles = [];

    // --- SELEÇÃO DE PERSONAGEM ---
    charCards.forEach(card => {
        card.addEventListener('click', () => {
            charCards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedChar = card.dataset.char;
        });
    });

    // --- AUDIO SINTETIZADO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'coin') {
            osc.frequency.setValueAtTime(987, now);
            osc.frequency.setValueAtTime(1318, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'star') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523, now);
            osc.frequency.linearRampToValueAtTime(1046, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'over') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.35);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
        }
    }

    // --- RENDERIZAÇÃO DO CENÁRIO EM HD ---
    function drawBackground() {
        // Céu Pastel em Degradê HD
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#ffcad4');
        skyGrad.addColorStop(0.4, '#ffe5ec');
        skyGrad.addColorStop(0.8, '#f8edeb');
        skyGrad.addColorStop(1, '#e8e8e4');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sol Radiante com Brilho Soft
        let sunGrad = ctx.createRadialGradient(720, 60, 10, 720, 60, 50);
        sunGrad.addColorStop(0, '#ffb703');
        sunGrad.addColorStop(0.6, 'rgba(255, 183, 3, 0.4)');
        sunGrad.addColorStop(1, 'rgba(255, 183, 3, 0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath(); ctx.arc(720, 60, 50, 0, Math.PI * 2); ctx.fill();

        // Nuvens Fofinhas e Flutuantes
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        drawCloud((140 - bgScroll * 0.12) % (canvas.width + 200) - 100, 45, 28);
        drawCloud((480 - bgScroll * 0.12) % (canvas.width + 200) - 100, 75, 34);
        drawCloud((790 - bgScroll * 0.12) % (canvas.width + 200) - 100, 35, 26);

        // Colinas de Fundo Suaves
        ctx.fillStyle = '#f28482';
        ctx.beginPath();
        ctx.ellipse(180 - (bgScroll * 0.2) % 800, GROUND_Y, 260, 95, 0, Math.PI, 0);
        ctx.ellipse(680 - (bgScroll * 0.2) % 800, GROUND_Y, 290, 110, 0, Math.PI, 0);
        ctx.fill();

        // Gramado de Frente
        ctx.fillStyle = '#84a59d';
        ctx.fillRect(0, GROUND_Y, canvas.width, 50);
        ctx.fillStyle = '#6b9080';
        ctx.fillRect(0, GROUND_Y, canvas.width, 6);

        // Detalhes de Flores no Chão
        for (let x = 0; x < canvas.width; x += 100) {
            let flowerX = (x - bgScroll) % canvas.width;
            if (flowerX < 0) flowerX += canvas.width;
            drawFlower(flowerX, GROUND_Y + 22);
        }
    }

    function drawCloud(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.arc(x + r * 0.6, y - r * 0.2, r * 0.7, 0, Math.PI * 2);
        ctx.arc(x + r * 1.2, y, r * 0.8, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawFlower(x, y) {
        ctx.fillStyle = '#ff758f';
        ctx.beginPath(); ctx.arc(x - 3, y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 3, y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y - 3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y + 3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // --- PERSONAGENS DESIGN VETORIAL HD ---
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Sombra Projetada no Chão
        if (!player.isJumping) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.ellipse(player.width / 2, player.height - 2, 22, 6, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // Aura de Poder (Estrela Invencível)
        if (player.starPowerTimer > 0) {
            ctx.shadowBlur = 18;
            ctx.shadowColor = `hsl(${(frameCount * 15) % 360}, 100%, 60%)`;
        }

        if (selectedChar === 'kitty') {
            drawHelloKittyHD(player.isDucking);
        } else if (selectedChar === 'melody') {
            drawMyMelodyHD(player.isDucking);
        } else if (selectedChar === 'cinnamoroll') {
            drawCinnamorollHD(player.isDucking);
        }

        ctx.restore();
    }

    function drawHelloKittyHD(ducking) {
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#2b2d42';

        if (ducking) {
            // Pose Agachada Refinada
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.ellipse(27, 20, 25, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            // Orelhinhas
            ctx.beginPath(); ctx.moveTo(8, 10); ctx.lineTo(2, 0); ctx.lineTo(16, 4); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(38, 4); ctx.lineTo(52, 0); ctx.lineTo(46, 10); ctx.fill(); ctx.stroke();
            drawBowHD(12, 4, 0.85);
        } else {
            // Blusinha Amarela + Macacão Azul HD
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(15, 36, 24, 8);
            ctx.fillStyle = '#0077b6';
            ctx.beginPath();
            ctx.moveTo(13, 38); ctx.lineTo(41, 38); ctx.lineTo(45, 52); ctx.lineTo(9, 52);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Botões do Macacão
            ctx.fillStyle = '#ffb703';
            ctx.beginPath(); ctx.arc(18, 42, 2.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(36, 42, 2.2, 0, Math.PI*2); ctx.fill();

            // Perninhas em Movimento
            let legOffset = player.isJumping ? 0 : Math.sin(frameCount * 0.45) * 5;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(14 + legOffset, 52, 9, 10); ctx.strokeRect(14 + legOffset, 52, 9, 10);
            ctx.fillRect(31 - legOffset, 52, 9, 10); ctx.strokeRect(31 - legOffset, 52, 9, 10);

            // Cabeça Redondinha Perfeita
            ctx.beginPath(); ctx.ellipse(27, 20, 25, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            // Orelhas
            ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(2, -4); ctx.lineTo(16, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(38, 4); ctx.lineTo(52, -4); ctx.lineTo(46, 8); ctx.closePath(); ctx.fill(); ctx.stroke();

            drawBowHD(12, 3, 1);
        }

        // Expressão Facial HD
        ctx.fillStyle = '#2b2d42';
        ctx.beginPath(); ctx.ellipse(17, 20, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(37, 20, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        // Narizinho Amarelo
        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.ellipse(27, 23, 3.2, 2.2, 0, 0, Math.PI * 2); ctx.fill();

        // Bigodinhos Autênticos
        ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(5, 17); ctx.lineTo(-3, 14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4, 21); ctx.lineTo(-4, 21); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5, 25); ctx.lineTo(-3, 28); ctx.stroke();

        ctx.beginPath(); ctx.moveTo(49, 17); ctx.lineTo(57, 14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(50, 21); ctx.lineTo(58, 21); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(49, 25); ctx.lineTo(57, 28); ctx.stroke();
    }

    function drawMyMelodyHD(ducking) {
        ctx.lineWidth = 2.2; ctx.strokeStyle = '#2b2d42';

        // Capuz Rosa Sanrio
        ctx.fillStyle = '#ff758f';
        if (!ducking) {
            // Orelhinhas Caídas e Fofas
            ctx.beginPath(); ctx.ellipse(10, 2, 8, 20, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(44, 2, 8, 20, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            
            // Vestidinho Rosa
            ctx.fillRect(14, 38, 26, 14); ctx.strokeRect(14, 38, 26, 14);
        }
        ctx.beginPath(); ctx.ellipse(27, 20, 25, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Rosto Branco Embutido
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(27, 23, 18, 13, 0, 0, Math.PI * 2); ctx.fill();

        // Florzinha no Capuz
        drawFlower(14, 10);

        // Olhos e Nariz
        ctx.fillStyle = '#2b2d42';
        ctx.beginPath(); ctx.ellipse(18, 22, 2.5, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(36, 22, 2.5, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.ellipse(27, 25, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    }

    function drawCinnamorollHD(ducking) {
        ctx.lineWidth = 2.2; ctx.strokeStyle = '#2b2d42';
        ctx.fillStyle = '#ffffff';

        // Orelhas Gigantes e Flutuantes
        let earWave = Math.sin(frameCount * 0.25) * 6;
        ctx.beginPath(); ctx.ellipse(2, 20 + earWave, 18, 8, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(52, 20 - earWave, 18, 8, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Cabeça Larga e Fofinha
        ctx.beginPath(); ctx.ellipse(27, 22, 25, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Olhinhos Azuis Brilhantes
        ctx.fillStyle = '#0077b6';
        ctx.beginPath(); ctx.ellipse(17, 22, 2.8, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(37, 22, 2.8, 3.8, 0, 0, Math.PI * 2); ctx.fill();
        
        // Bochechas Rosa Pastel
        ctx.fillStyle = '#ffb5a7';
        ctx.beginPath(); ctx.ellipse(11, 26, 4.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(43, 26, 4.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    }

    function drawBowHD(x, y, scale) {
        ctx.save();
        ctx.translate(x, y); ctx.scale(scale, scale);
        ctx.fillStyle = '#ff4d6d'; ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.ellipse(-9, 0, 9, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(9, 0, 9, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff758f';
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    // --- SISTEMA DE PARTÍCULAS ---
    function createDustParticle() {
        if (!player.isJumping && gameRunning) {
            particles.push({
                x: player.x,
                y: GROUND_Y - 4,
                vx: -Math.random() * 2.5 - 1,
                vy: -Math.random() * 1.5,
                size: Math.random() * 5 + 2,
                alpha: 1
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.alpha -= 0.03;
            if (p.alpha <= 0) particles.splice(i, 1);
            else {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    // --- OBSTÁCULOS E COLETÁVEIS ---
    function spawnObstaclesAndItems() {
        if (frameCount % 85 === 0) {
            let rand = Math.random();
            if (rand < 0.6) {
                let isAir = Math.random() < 0.35;
                obstacles.push({
                    x: canvas.width,
                    y: isAir ? GROUND_Y - 95 : GROUND_Y - 36,
                    width: 34,
                    height: 36,
                    type: isAir ? 'balloon' : 'gift'
                });
            } else if (rand < 0.88) {
                collectibles.push({
                    x: canvas.width,
                    y: GROUND_Y - (Math.random() > 0.5 ? 85 : 35),
                    width: 26,
                    height: 26,
                    type: Math.random() < 0.15 ? 'star' : 'bow'
                });
            }
        }
    }

    // --- LOOP E LÓGICA DO JOGO ---
    function startGame() {
        score = 0; coins = 0; gameSpeed = 6;
        obstacles = []; collectibles = []; particles = [];
        frameCount = 0;
        player.y = GROUND_Y - player.baseHeight;
        player.dy = 0; player.starPowerTimer = 0;
        gameRunning = true;

        currentScoreSpan.innerText = score;
        coinsScoreSpan.innerText = coins;
        overlay.style.display = 'none';
        gameLoop();
    }

    function gameOver() {
        gameRunning = false;
        playSound('over');
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('hk_hd_best', bestScore);
            bestScoreSpan.innerText = bestScore;
        }
        gameTitle.innerText = "FIM DE JOGO! 🎈";
        startBtn.innerText = "JOGAR NOVAMENTE";
        overlay.style.display = 'flex';
    }

    function gameLoop() {
        if (!gameRunning) return;
        frameCount++;
        bgScroll += gameSpeed * 0.5;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        // Atualização da Física de Pulo
        if (player.isJumping) {
            player.dy += GRAVITY;
            player.y += player.dy;
            if (player.y >= GROUND_Y - player.height) {
                player.y = GROUND_Y - player.height;
                player.isJumping = false;
            }
        } else if (frameCount % 4 === 0) {
            createDustParticle();
        }

        if (player.starPowerTimer > 0) player.starPowerTimer--;

        drawPlayer();
        updateParticles();
        spawnObstaclesAndItems();

        // Processa Coletáveis (Laços / Estrelas)
        for (let i = collectibles.length - 1; i >= 0; i--) {
            let c = collectibles[i];
            c.x -= gameSpeed;

            if (c.type === 'star') {
                ctx.fillStyle = '#ffb703';
                ctx.beginPath(); ctx.arc(c.x + 13, c.y + 13, 13, 0, Math.PI * 2); ctx.fill();
            } else {
                drawBowHD(c.x + 13, c.y + 13, 0.85);
            }

            // Colisão com Coletável
            if (
                player.x < c.x + c.width &&
                player.x + player.width > c.x &&
                player.y < c.y + c.height &&
                player.y + player.height > c.y
            ) {
                if (c.type === 'star') {
                    player.starPowerTimer = 300;
                    playSound('star');
                } else {
                    coins += 1;
                    coinsScoreSpan.innerText = coins;
                    playSound('coin');
                }
                collectibles.splice(i, 1);
            } else if (c.x < -30) collectibles.splice(i, 1);
        }

        // Processa Obstáculos
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            ctx.fillStyle = obs.type === 'balloon' ? '#4ea8de' : '#ff4d6d';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            let margin = 6;
            if (
                player.x + margin < obs.x + obs.width - margin &&
                player.x + player.width - margin > obs.x + margin &&
                player.y + margin < obs.y + obs.height - margin &&
                player.y + player.height - margin > obs.y + margin
            ) {
                if (player.starPowerTimer > 0) {
                    obstacles.splice(i, 1);
                } else {
                    gameOver();
                    return;
                }
            }

            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
                score += 10;
                currentScoreSpan.innerText = score;
                if (score % 100 === 0 && gameSpeed < 12) gameSpeed += 0.5;
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // --- CONTROLES ---
    function jump() {
        if (gameRunning && !player.isJumping && !player.isDucking) {
            player.dy = JUMP_FORCE;
            player.isJumping = true;
            playSound('jump');
        }
    }

    function duck(state) {
        if (!gameRunning || player.isJumping) return;
        player.isDucking = state;
        player.height = state ? player.duckHeight : player.baseHeight;
        player.y = GROUND_Y - player.height;
    }

    window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
            e.preventDefault();
            if (!gameRunning && overlay.style.display !== 'none') startGame();
            else jump();
        }
        if (['ArrowDown', 'KeyS'].includes(e.code)) {
            e.preventDefault();
            duck(true);
        }
    });

    window.addEventListener('keyup', (e) => {
        if (['ArrowDown', 'KeyS'].includes(e.code)) duck(false);
    });

    jumpBtn.addEventListener('click', jump);
    duckBtn.addEventListener('mousedown', () => duck(true));
    duckBtn.addEventListener('mouseup', () => duck(false));
    duckBtn.addEventListener('touchstart', (e) => { e.preventDefault(); duck(true); });
    duckBtn.addEventListener('touchend', (e) => { e.preventDefault(); duck(false); });

    startBtn.addEventListener('click', startGame);
    drawBackground();
</script>
</body>
